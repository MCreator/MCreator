<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/editor-styles.css">
    <script>
        window.MonacoEnvironment = {
            baseUrl: 'http://mcreator/monaco/',
            getWorkerUrl: function (workerId, label) {
                return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(
                    'self.MonacoEnvironment = { baseUrl: "http://mcreator/monaco/" };' +
                    'importScripts("http://mcreator/monaco/vs/base/worker/workerMain.js");'
                );
            }
        };
    </script>
    <script src="./vs/loader.js"></script>
</head>
<body>
<div id="container"></div>

<script src="./js/editor-languages.js"></script>
<script src="./js/editor-autocomplete.js"></script>
<script src="./js/editor-api.js"></script>

<script>
    var editor = null;
    var isSettingValue = false;
    var pendingInit = null;

    require.config({ paths: { 'vs': './vs' } });

    require(['vs/editor/editor.main'], function () {

        registerLanguages();

        var initData = pendingInit || {
            code: '',
            language: 'java',
            theme: 'vs-dark',
            readOnly: false,
            fontSize: 14
        };

        editor = monaco.editor.create(document.getElementById('container'), {
            value: initData.code,
            language: initData.language,
            theme: 'vs-dark',
            readOnly: initData.readOnly,
            fontSize: initData.fontSize,
            automaticLayout: true,
            minimap: { enabled: true },
            scrollBeyondLastLine: false,
            renderWhitespace: 'selection',
            tabSize: 4,
            insertSpaces: false,
            mouseWheelZoom: true,
            glyphMargin: initData.language === 'java'
        });

        var breakpointDecorations = [];
        window.setBreakpoints = function(lines) {
            var newDecorations = lines.map(function(line) {
                return {
                    range: new monaco.Range(line, 1, line, 1),
                    options: {
                        isWholeLine: false,
                        glyphMarginClassName: 'breakpoint-glyph'
                    }
                };
            });
            breakpointDecorations = editor.deltaDecorations(breakpointDecorations, newDecorations);
        };

        function invokeBridge(method, arg1, arg2) {
            if (window.javabridge && window.javabridge[method]) {
                if (arg2 !== undefined) window.javabridge[method](arg1, arg2, { callback: function () {} });
                else if (arg1 !== undefined) window.javabridge[method](arg1, { callback: function () {} });
                else window.javabridge[method]({ callback: function () {} });
            }
        }

        editor.onDidChangeModelContent(function (e) {
            if (!isSettingValue) {
                invokeBridge('onTextChanged', editor.getValue());
            }
        });

        editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () {
            invokeBridge('onSaveRequested');
        });

        editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyB, function () {
            invokeBridge('onSaveAndBuildRequested');
        });

        editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Space, function () {
            if (window.autocompleteEnabled) {
                editor.trigger('keyboard', 'editor.action.triggerSuggest', {});
            }
        });

        editor.onMouseDown(function (e) {
            var isJava = editor.getModel() && editor.getModel().getLanguageId() === 'java';
            if (isJava && e.target.type === monaco.editor.MouseTargetType.GUTTER_GLYPH_MARGIN) {
                var line = e.target.position.lineNumber;
                invokeBridge('onBreakpointToggled', line.toString());
            }

            if ((e.event.ctrlKey || e.event.metaKey) && (e.event.leftButton || e.event.button === 0)) {
                var target = e.target;
                if (target && target.position) {
                    var model = editor.getModel();
                    var word = model.getWordAtPosition(target.position);
                    if (word && word.word) {
                        invokeBridge('onOpenDeclaration', word.word);
                    }
                }
            }
        });

        registerJavaAutocomplete(editor);

        if (pendingInit) {
            initEditor(
                pendingInit.code,
                pendingInit.language,
                pendingInit.readOnly,
                pendingInit.fontSize,
                pendingInit.autocompleteEnabled,
                pendingInit.autocompleteMode,
                pendingInit.autocompleteDocWindow
            );
        }

        if (window.javabridge && window.javabridge.onEditorReady) {
            window.javabridge.onEditorReady({ callback: function () {} });
        }
    });
</script>
</body>
</html>
