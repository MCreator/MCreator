base_types:
  - type: dispensebehavior
    condition: hasDispenseBehavior

global_templates:
  - template: itemextension/fuels.java.ftl
    writer: java
    condition: "${itemextensions?filter(e -> e.enableFuel)?size != 0}"
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameFuels.java"
  - template: itemextension/compostable_items.java.ftl
    writer: java
    condition: "${itemextensions?filter(e -> e.compostLayerChance gt 0)?size != 0}"
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameCompostables.java"

templates:
  - template: itemextension/compostable_provider.json.ftl
    writer: json
    condition: "compostLayerChance #> 0"
    name: "@MODDATAROOT/context_int_provider/compostable/@registryname.json"
  - template: itemextension/fuel_provider.json.ftl
    writer: json
    condition: enableFuel
    name: "@MODDATAROOT/context_int_provider/fuel/@registryname.json"