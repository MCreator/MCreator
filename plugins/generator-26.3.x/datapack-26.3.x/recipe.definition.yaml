templates:
  - template: recipe/smelting.json.ftl
    writer: json
    name: "@RESROOT/data/@[getNamespace()]/recipe/@[getName()].json"
    condition:
      - "recipeType %= Smelting"
      - "isValidRecipe()"
  - template: recipe/blasting.json.ftl
    writer: json
    name: "@RESROOT/data/@[getNamespace()]/recipe/@[getName()].json"
    condition:
      - "recipeType %= Blasting"
      - "isValidRecipe()"
  - template: recipe/campfire_cooking.json.ftl
    writer: json
    name: "@RESROOT/data/@[getNamespace()]/recipe/@[getName()].json"
    condition:
      - "recipeType %= Campfire cooking"
      - "isValidRecipe()"
  - template: recipe/smoking.json.ftl
    writer: json
    name: "@RESROOT/data/@[getNamespace()]/recipe/@[getName()].json"
    condition:
      - "recipeType %= Smoking"
      - "isValidRecipe()"
  - template: recipe/crafting.json.ftl
    writer: json
    name: "@RESROOT/data/@[getNamespace()]/recipe/@[getName()].json"
    condition:
      - "recipeType %= Crafting"
      - "isValidRecipe()"
  - template: recipe/stonecutting.json.ftl
    writer: json
    name: "@RESROOT/data/@[getNamespace()]/recipe/@[getName()].json"
    condition:
      - "recipeType %= Stone cutting"
      - "isValidRecipe()"
  - template: recipe/smithing.json.ftl
    writer: json
    name: "@RESROOT/data/@[getNamespace()]/recipe/@[getName()].json"
    condition:
      - "recipeType %= Smithing"
      - "isValidRecipe()"
  - template: recipe/brewing.json.ftl
    writer: json
    name: "@RESROOT/data/@[getNamespace()]/recipe/brewing/@[getName()].json"
    condition:
      - "isBrewingWithItemInput()"
      - "isValidRecipe()"
  # If the brewing input is a potion, generate a file for each potion item
  - template: recipe/brewing.json.ftl
    writer: json
    variables: "inputitem=minecraft:potion"
    name: "@RESROOT/data/@[getNamespace()]/recipe/brewing/@[getName()].json"
    condition:
      - "isBrewingWithPotionInput()"
      - "isValidRecipe()"
  - template: recipe/brewing.json.ftl
    writer: json
    variables: "inputitem=minecraft:splash_potion"
    name: "@RESROOT/data/@[getNamespace()]/recipe/brewing/splash_@[getName()].json"
    condition:
      - "isBrewingWithPotionInput()"
      - "isValidRecipe()"
  - template: recipe/brewing.json.ftl
    writer: json
    variables: "inputitem=minecraft:lingering_potion"
    name: "@RESROOT/data/@[getNamespace()]/recipe/brewing/lingering_@[getName()].json"
    condition:
      - "isBrewingWithPotionInput()"
      - "isValidRecipe()"

  - template: recipe/unlocking_advancement.json.ftl
    writer: json
    name: "@MODDATAROOT/advancement/recipes/@registryname.json"
    condition:
      - "hasAdvancement()"
      - "isValidRecipe()"